services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resolve-db
    environment:
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve
      POSTGRES_DB: resolve
    ports:
      - "5434:5432"
    volumes:
      - resolve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolve -d resolve"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  resolve_pgdata:
