[project]
name = "resolve-server"
version = "0.1.0"
description = "Resolve API, voice gateway, privacy, and persistence."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=44",
    "pyyaml>=6.0",
    "pgvector>=0.3",
    "python-multipart>=0.0.18",
    "langgraph>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls paid vendors; skipped by default",
    "slow: slow tests; skipped by default",
]
addopts = "-q -m 'not live and not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]
