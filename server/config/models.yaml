    mode: instruct
    reasoning_effort: none
    fallback: openai/gpt-oss-120b
  summarize:
    model: qwen/qwen3.8-27b
    mode: instruct
    reasoning_effort: none
    fallback: openai/gpt-oss-120b
  classify:
